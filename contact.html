<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Mahdey Hussain | Contact Me</title>

    <!-- laptop/desktop style sheet -->
    <link href="css/full.css" rel="stylesheet" type="text/css" media="only screen and (min-width:960px)">
    <!-- tablet style sheet -->
    <link href="css/tablet.css" rel="stylesheet" type="text/css"
        media="only screen and (min-width:481px) and (max-width:959px)">
    <!-- smartphone style sheet -->
    <link href="css/smartphone.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">
</head>

<body>
    <!-- wrapper holds all the page content so we can size and center it with CSS -->
    <div id="wrapper">
        <!-- header: site title and navigation, same on every page -->
        <header>
            <h1>Mahdey Hussain</h1>
            <nav>
                <p>
                    <a href="index.html">Home</a> |
                    <a href="about.html">About Me</a> |
                    <a href="projects.html">Projects</a> |
                    <a href="contact.html">Contact Me</a>
                </p>
            </nav>
        </header>
        <!-- article: the main content of this page -->
        <article>
            <section>
                <h2>Contact Me</h2>
                <p>Have a question or want to work together? Fill out the form below and I'll get back to you!</p>
            </section>
            <section>
                <h2>Send Me a Message</h2>
                <!-- form sends the visitor's message to my email using mailto (week 2)-->
                <form action="mailto:mahdey.hussain@ontariotechu.net" method="post" enctype="text/plain"
                    name="contact_form">
                    <p>
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" size="32" placeholder="Enter your full name"
                            required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" size="32" placeholder="Enter your email address"
                            required>
                    </p>
                    <p>
                        <!-- pattern only accepts exactly 10 digits; syntax from W3Schools (cited in README) -->
                        <label for="phone">Cell No.:</label>
                        <input type="tel" id="phone" name="phone" size="32" placeholder="e.g. 6471235890"
                            pattern="[0-9]{10}" title="Enter a 10-digit phone number (numbers only)" required>
                    </p>
                    <p>
                        <label for="comments">Message:</label><br>
                        <textarea id="comments" name="comments" cols="60" rows="6"
                            placeholder="Question, comment or query..." required></textarea>
                    </p>
                    <p>
                        <label for="robot">What is 2 + 2? (So I know you aren't a robot)</label>
                        <input type="number" id="robot" name="robot" min="4" max="4" required>
                    </p>
                    <p>
                        <button type="submit">Send Message</button>
                        <button type="reset">Clear Form</button>
                    </p>
                </form>
            </section>
        </article>
        <!-- footer: contact email and copyright, same on every page -->
        <footer>
            <address>
                <p>Contact me at <a href="mailto:mahdey.hussain@ontariotechu.net">mahdey.hussain@ontariotechu.net</a>
                </p>
            </address>
            <p>&copy; Mahdey Hussain 2026</p>
        </footer>
    </div>
</body>

</html>
